  presets: Preset
  presetToggle: 'Preset $1, $2 di $3 siti bloccati'
  presetDomains: 'Blocca $1'
  presetNoSites: Nessun sito in questo preset
  savePreset: Salva lista come preset
  savePresetNote: Salva tutti i siti della lista. Disattivando il preset vengono rimossi.
  presetName: Nome del preset
  save: Salva
  cancel: Annulla
  presetNameEmpty: Inserisci un nome.
  presetNameTooLong: 'Usa al massimo $1 caratteri.'
  presetNameTaken: Esiste già un preset con questo nome.
  editSavedPresets: Modifica preset salvati
  savedPresets: Preset salvati
  renamePreset: Rinomina
  renamePresetLabel: 'Rinomina $1'
  deletePreset: Elimina
  deletePresetLabel: 'Elimina $1'
  deletePresetConfirm: 'Eliminare $1? I suoi siti restano bloccati.'
  keepPreset: Mantieni
  sites: Siti
  blockedSites: Siti bloccati
  blocklistName: lista dei bloccati
  addTo: 'Aggiungi a $1'
  entriesAriaLabel: '$1 voci'
  exampleDomain: example.com
  empty: Nessun sito bloccato.
  invalidUrl: Inserisci un URL valido
  alreadyInList: '$1 è già nella $2.'
  added: 'Aggiunto $1.'
  locked: La lista è bloccata. Reimposta il timer per modificarla.
  addOnly: Durante una sessione puoi aggiungere siti. Rimuoverli richiede di reimpostare il timer.
  summarySites: 'Blocca $1 siti · solo aggiunte durante una sessione'
